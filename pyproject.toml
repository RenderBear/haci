[project]
name = "haci"
version = "0.1.0"
description = "Harmonic Contour Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.0.0",
    "pillow>=12.1.0",
    "pyyaml>=6.0.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
]

[project.optional-dependencies]
baselines = ["opencv-python-headless>=4.10"]

[project.scripts]
train = "haci.cli:train"
test = "haci.cli:test"
infer = "haci.cli:infer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haci"]

[tool.uv]
package = true
link-mode = "copy"

